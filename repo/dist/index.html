<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="유진코 재고">
<meta name="mobile-web-app-capable" content="yes">



<meta name="robots" content="noindex">
<title>인터넷쇼핑몰 재고현황 | 유진코</title>
<style>
  :root{
    --purple:#5B3CE8; --purple-deep:#4A2FD1;
    --purple-soft:#F0EDFD; --purple-card:#F7F7FD;
    --pink-soft:#FAF0F5; --line:#F0F0F0; --line2:#E8E8EE;
    --ink:#14131A; --muted:#8B8B96; --bg:#fff; --gray:#F5F5F7;
    --ok:#0E9F6E; --low:#D97706; --out:#DC2626; --neg:#B91C1C;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding-bottom:96px}
  .brandTag{text-align:center;font-size:11.5px;font-weight:700;color:#5A5A66;letter-spacing:.14em;
    padding:16px 20px 0;line-height:1.4;word-break:keep-all}
  .logoStrip{padding:9px 20px 8px;display:flex;justify-content:center}
  .logoStrip img{height:42px;width:auto;display:block}
  .top{display:flex;align-items:center;gap:10px;padding:8px 20px 6px}
  .top .doc{width:30px;height:30px;flex:0 0 30px}
  .top h1{font-size:19px;font-weight:800;letter-spacing:-.85px;margin:0;flex:1;line-height:1.28;word-break:keep-all}
  .iconbtn{width:38px;height:38px;border:0;background:transparent;display:grid;place-items:center;border-radius:10px;cursor:pointer}
  .iconbtn:active{background:var(--gray)}
  .subbar{display:flex;align-items:center;justify-content:space-between;padding:2px 20px 12px;border-bottom:1px solid #FDF0F5}
  .subbar .cnt{font-size:15px;color:#2B2B33;font-weight:500}
  .subbar .cnt b{color:var(--purple);font-weight:800}
  .groupBar{position:sticky;top:0;z-index:25;background:#fff;padding:8px 20px 6px;
    border-bottom:1px solid #F2EFFB}
  .gbtnBig{display:flex;align-items:center;gap:10px;width:100%;border:0;cursor:pointer;
    background:linear-gradient(118deg,#4F46E5 0%,#5B52EE 55%,#655BF0 100%);color:#fff;
    border-radius:22px;padding:11px 13px;font-family:inherit;text-align:left;
    box-shadow:0 8px 22px rgba(79,70,229,.32), inset 0 1px 0 rgba(255,255,255,.10);
    -webkit-tap-highlight-color:transparent;transition:transform .12s ease, box-shadow .12s ease}
  .gbtnBig:active{transform:translateY(1px);box-shadow:0 4px 14px rgba(79,70,229,.30)}
  .gbtnBig .gbi{width:42px;height:42px;flex:0 0 42px;border-radius:14px;
    background:rgba(255,255,255,.16);display:grid;place-items:center;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
  .gbtnBig .gbt{flex:1;min-width:0;display:flex;align-items:center}
  .gbtnBig .gbt b{display:block;font-size:17px;font-weight:900;letter-spacing:-.7px;
    line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 1px 2px rgba(30,20,90,.18)}
  .gbtnBig .gbt span{position:absolute;width:1px;height:1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap}
  .gbtnBig .gba{font-size:11px;font-weight:800;letter-spacing:-.2px;
    background:rgba(255,255,255,.17);padding:8px 11px;border-radius:999px;
    white-space:nowrap;flex:0 0 auto;line-height:1}
  .searchWrap{display:none;padding:10px 20px 6px}
  .searchWrap.on{display:block}
  .searchBox{display:flex;align-items:center;gap:8px;background:var(--gray);border-radius:12px;padding:11px 14px}
  .searchBox input{border:0;background:transparent;outline:0;font-size:15px;width:100%;color:var(--ink);font-family:inherit}
  .searchBox input::placeholder{color:#A6A6B0}
  .card{margin:14px 20px 4px;background:var(--purple-card);border-radius:18px;padding:18px 18px 20px;cursor:pointer}
  .card .lbl{font-size:13.5px;color:#7A7A88;font-weight:600;margin-bottom:2px}
  .card .row{display:flex;align-items:center;gap:9px}
  .card .num{font-size:31px;font-weight:800;color:var(--purple);letter-spacing:-1px;line-height:1.15}
  .card .go{margin-left:auto;color:var(--purple)}
  .card .sub2{font-size:12px;color:#9A9AAA;margin-top:2px}
  .sumamt{margin-top:11px;padding-top:11px;border-top:1px dashed #E2DEF6;
    display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .sumamt span{font-size:12.5px;font-weight:600;color:#7A7A88}
  .sumamt b{font-size:16.5px;font-weight:800;color:var(--purple-deep);letter-spacing:-.4px;
    font-variant-numeric:tabular-nums}
  .list{margin-top:10px}
  .item{padding:18px 20px 0}
  .item .body{display:flex;gap:12px}
  .mono{width:52px;height:52px;border-radius:12px;border:1px solid var(--line2);background:#FAFAFC;
    display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--purple);letter-spacing:-.3px;
    text-align:center;line-height:1.15;padding:4px;word-break:break-all;flex:0 0 52px}
  .tagrow{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
  .chip{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:7px;background:var(--purple-soft);color:var(--purple-deep)}
  .chip.pink{background:var(--pink-soft);color:#B04A7A}
  .chip.ok{background:#E7F7F0;color:var(--ok)}
  .chip.low{background:#FEF3E2;color:var(--low)}
  .chip.out{background:#FDECEC;color:var(--out)}
  .chip.neg{background:#FBE4E4;color:var(--neg)}
  .nm{font-size:16px;font-weight:700;letter-spacing:-.35px;line-height:1.32;margin:0 0 5px}
  .meta{font-size:13px;color:var(--muted);letter-spacing:-.2px}
  .qtybar{margin:12px 0 0;background:var(--gray);border-radius:10px;padding:10px 6px;
    display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:2px}
  .qtybar .q1{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;
    padding:0 4px;border-left:1px solid #E9E9EF}
  .qtybar .q1:first-child{border-left:0}
  .qtybar .q1 span{font-size:10.5px;font-weight:700;color:#8B8B96;letter-spacing:-.2px;white-space:nowrap}
  .qtybar .q1 b{font-size:13px;font-weight:800;color:#2B2B33;letter-spacing:-.3px;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .qtybar .q1 b.neg{color:var(--neg)}
  .qtybar .q1 b.na{color:#C0C0CA;font-weight:700}
  .sep{height:1px;background:var(--line);margin:16px 0 0}
  .empty{padding:56px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
  .fab{position:fixed;right:20px;bottom:26px;height:54px;padding:0 20px;border:0;border-radius:999px;
    background:var(--purple);color:#fff;font-size:15px;font-weight:800;font-family:inherit;
    box-shadow:0 8px 22px rgba(91,60,232,.34);display:flex;align-items:center;gap:8px;cursor:pointer;z-index:40}
  .fab:active{transform:translateY(1px)}
  /* ── 하단 고정 TOP 바로가기 (좌측: 재고업데이트 FAB와 겹치지 않게) ── */
  .topBtn{position:fixed;left:20px;bottom:calc(26px + env(safe-area-inset-bottom, 0px));
    z-index:30;display:flex;align-items:center;gap:5px;height:44px;padding:0 15px 0 12px;
    border:0;border-radius:999px;cursor:pointer;font-family:inherit;
    background:linear-gradient(118deg,#4F46E5 0%,#5B52EE 60%,#655BF0 100%);color:#fff;
    font-size:12.5px;font-weight:900;letter-spacing:-.3px;line-height:1;
    box-shadow:0 8px 20px rgba(79,70,229,.34), inset 0 1px 0 rgba(255,255,255,.14);
    opacity:0;transform:translateY(10px) scale(.94);pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    -webkit-tap-highlight-color:transparent}
  .topBtn.on{opacity:1;transform:none;pointer-events:auto}
  .topBtn:active{transform:translateY(1px) scale(.97)}
  .topBtn svg{display:block;flex:0 0 auto}
  .sheet{position:fixed;inset:0;background:rgba(18,16,28,.42);display:none;z-index:60;align-items:flex-end}
  .sheet.on{display:flex}
  .panel{width:100%;background:#fff;border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:92vh;overflow-y:auto;animation:up .22s ease}
  @keyframes up{from{transform:translateY(26px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .panel h2{font-size:19px;margin:0 0 4px;letter-spacing:-.4px}
  .panel p.hint{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.65}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:#5A5A66;margin-bottom:7px}
  .field input[type=password]{width:100%;padding:13px 14px;border:1px solid var(--line2);border-radius:11px;
    font-size:15px;font-family:inherit;outline:0}
  .field input[type=password]:focus{border-color:var(--purple)}
  .drop{border:1.5px dashed var(--line2);border-radius:12px;padding:20px 14px;text-align:center;cursor:pointer;background:#FCFCFE}
  .drop.has{border-color:var(--purple);background:var(--purple-soft)}
  .drop .f1{font-size:14px;font-weight:700;color:#3A3A46;word-break:break-all}
  .drop .f2{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
  .btn{width:100%;border:0;border-radius:12px;padding:15px;font-size:15.5px;font-weight:800;
    font-family:inherit;cursor:pointer;margin-top:6px}
  .btn.pri{background:var(--purple);color:#fff}
  .btn.pri:disabled{background:#C9BFF5;cursor:default}
  .btn.ghost{background:var(--gray);color:#4A4A55;margin-top:8px}
  .msg{font-size:13px;line-height:1.6;border-radius:10px;padding:11px 13px;margin:12px 0 0;display:none}
  .msg.on{display:block}
  .msg.err{background:#FDECEC;color:#B91C1C}
  .msg.ok{background:#E7F7F0;color:#0E7A55}
  .msg.info{background:var(--purple-soft);color:#4A2FD1}
  .steps{background:#FAFAFC;border:1px solid var(--line2);border-radius:12px;padding:14px 16px;margin:14px 0 0}
  .steps b{display:block;font-size:12.5px;color:#5A5A66;margin-bottom:8px}
  .steps ol{margin:0;padding-left:18px;font-size:13px;color:#4A4A55;line-height:1.85}
  .foot{padding:26px 20px 8px;text-align:center;font-size:11.5px;color:#B4B4BE;line-height:1.9}
  
  /* ── 품목그룹 ── */
  .gbtn{flex:0 0 auto;border:1px solid #E2DEF6;background:#fff;color:var(--purple-deep);font-family:inherit;
    font-size:12.5px;font-weight:800;padding:6px 11px;border-radius:999px;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;letter-spacing:-.3px;white-space:nowrap}
  .gbtn b{font-weight:800;color:var(--purple);font-variant-numeric:tabular-nums}
  .gbtn:active{background:var(--purple-soft)}
  .gtag{display:flex;align-items:center;gap:7px;padding:10px 20px 0}
  .gtag .tg{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;background:var(--purple);color:#fff;
    font-size:12.5px;font-weight:800;padding:6px 10px 6px 12px;border-radius:999px;letter-spacing:-.3px}
  .gtag .tg button{background:rgba(255,255,255,.24);border:0;color:#fff;width:17px;height:17px;
    border-radius:50%;font-size:11px;line-height:1;cursor:pointer;padding:0;font-family:inherit}
  .gtag .cnt{font-size:12px;color:#8B8B96;font-weight:600}
  .chip.grp{background:#EEF6F1;color:#0E7A55}
  .gmodal{position:fixed;inset:0;background:rgba(20,19,26,.45);display:none;z-index:60;
    align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .gmodal.on{display:flex}
  .gpanel{background:#fff;width:100%;max-width:520px;max-height:86vh;border-radius:20px 20px 0 0;
    display:flex;flex-direction:column;overflow:hidden;animation:gup .22s ease-out}
  @keyframes gup{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .ghead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;
    border-bottom:1px solid var(--line)}
  .ghead h2{font-size:17px;font-weight:800;margin:0;letter-spacing:-.5px}
  .ghead button{background:none;border:0;color:#8B8B96;font-size:13px;font-weight:700;
    font-family:inherit;cursor:pointer;padding:4px 2px}
  .gsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 20px 6px}
  .gsum .gcell{background:var(--purple-card);border-radius:12px;padding:10px 8px;text-align:center;min-width:0}
  .gsum .gcell span{display:block;font-size:10.5px;color:#8B8B96;font-weight:700;margin-bottom:3px}
  .gsum .gcell b{font-size:13px;font-weight:800;color:var(--purple-deep);letter-spacing:-.4px;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .glist{overflow-y:auto;padding:8px 14px 26px;-webkit-overflow-scrolling:touch}
  .grow{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line2);
    border-radius:12px;padding:12px 14px;margin:8px 0 0;font-family:inherit;cursor:pointer}
  .grow:active{background:#FAFAFC}
  .grow.on{border-color:var(--purple);background:var(--purple-soft)}
  .grow.all{background:#FAFAFC;border-style:dashed}
  .grow .gn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px;font-weight:800;color:var(--ink);letter-spacing:-.4px;
    display:flex;align-items:baseline;gap:7px;margin-bottom:5px}
  .grow .gn i{font-style:normal;font-size:11.5px;font-weight:700;color:#8B8B96}
  .grow .gv{flex-wrap:nowrap;display:flex;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:700;
    color:#5A5A66;font-variant-numeric:tabular-nums}
  .grow .gv span:last-child{color:var(--purple-deep)}
.foot button{background:none;border:0;color:#C4C4CE;font-size:11px;font-family:inherit;cursor:pointer;text-decoration:underline;padding:0}

  .live{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;
    color:#8B8B96;font-weight:700;padding:2px 20px 8px;letter-spacing:-.2px}
  .live i{width:7px;height:7px;border-radius:50%;background:#0E9F6E;display:block;
    box-shadow:0 0 0 3px rgba(14,159,110,.14)}
  .live.off i{background:#DC2626;box-shadow:0 0 0 3px rgba(220,38,38,.14)}
  .live b{color:#5A5A66}
  .reloadBar{position:fixed;left:12px;right:12px;bottom:84px;z-index:45;background:#14131A;color:#fff;
    border:0;border-radius:14px;padding:13px 16px;font-family:inherit;font-size:13.5px;font-weight:800;
    display:none;align-items:center;justify-content:center;gap:8px;cursor:pointer;
    box-shadow:0 10px 26px rgba(0,0,0,.24);letter-spacing:-.3px}
  .reloadBar.on{display:flex;animation:gup .2s ease-out}
  .reloadBar span{background:rgba(255,255,255,.2);border-radius:999px;padding:2px 8px;font-size:11px}
  .foot a{color:#C4C4CE;text-decoration:underline}
  .nowrap{white-space:nowrap}
</style>
</head>

function openGroups(){
  var st = groupStats(), tn = 0, tq = 0, ta = 0;
  for (var i = 0; i < st.length; i++){ tn += st[i].n; tq += st[i].q; ta += st[i].a; }
  $("#gSum").innerHTML =
    '<div class="gcell"><span>\uC804\uCCB4 \uD488\uBAA9</span><b>' + fmt(tn) + '</b></div>' +
    '<div class="gcell"><span>\uCD1D \uC7AC\uACE0\uC218\uB7C9</span><b>' + fmt(tq) + '</b></div>' +
    '<div class="gcell"><span>\uCD1D \uC7AC\uACE0\uAE08\uC561</span><b>' + fmtInt(ta) + '</b></div>';
  var h = '<button class="grow all' + (group ? "" : " on") + '" data-g="">' +
          '<div class="gn">\uC804\uCCB4 \uBCF4\uAE30</div>' +
          '<div class="gv"><span>' + fmt(tn) + '\uC885 \u00B7 ' + fmt(tq) + '\uAC1C</span><span>' + fmtInt(ta) + '\uC6D0</span></div></button>';
  for (var j = 0; j < st.length; j++){
    var x = st[j];
    h += '<button class="grow' + (group === x.g ? " on" : "") + '" data-g="' + esc(x.g) + '">' +
         '<div class="gn">' + esc(x.g) + ' <i>' + fmt(x.n) + '\uC885</i></div>' +
         '<div class="gv"><span>\uC218\uB7C9 ' + fmt(x.q) + '</span><span>' + fmtInt(x.a) + '\uC6D0</span></div></button>';
  }
  $("#gList").innerHTML = h;
  $("#gModal").classList.add("on");
}
function closeGroups(){ $("#gModal").classList.remove("on"); }

/* ── 목록 ── */
function render(reset){
  if (reset){ $("#list").innerHTML = ""; shown = 0; }
  var slice = VIEW.slice(shown, shown + CHUNK);
  var frag = document.createDocumentFragment();
  slice.forEach(function(r){
    var code = r[0], name = r[1], qty = r[2];
    var price = (r[3] === null || r[3] === undefined) ? null : Number(r[3]);
    var amt = (r[4] === null || r[4] === undefined) ? null : Number(r[4]);
    var cellP = function(v){ return (v === null || !isFinite(v)) ? '<b class="na">—</b>' : '<b>' + fmtDec(v) + '</b>'; };
    var cellA = function(v){ return (v === null || !isFinite(v)) ? '<b class="na">—</b>' : '<b>' + fmtInt(v) + '</b>'; };
    var st = stateOf(qty);
    var mono = String(code).replace(/[^0-9A-Za-z가-힣]/g, "").slice(0, 6) || "?";
    var d = document.createElement("div");
    d.className = "item";
    d.innerHTML =
      '<div class="body">' +
        '<div class="mono">' + esc(mono) + '</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div class="tagrow">' +
          (st.k === "ok" ? "" : '<span class="chip ' + st.k + '">' + st.t + '</span>') +
          '<span class="chip">쇼핑몰</span>' +
          (r[5] ? '<span class="chip grp">' + esc(r[5]) + '</span>' : '') + '</div>' +
          '<p class="nm">' + esc(name) + '</p>' +
          '<div class="meta">품목코드 : ' + esc(code) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="qtybar">' +
        '<div class="q1"><span>재고수량</span><b' + (qty < 0 ? ' class="neg"' : '') + '>' + fmt(qty) + '</b></div>' +
        '<div class="q1"><span>재고단가</span>' + cellP(price) + '</div>' +
        '<div class="q1"><span>재고금액</span>' + cellA(amt) + '</div>' +
      '</div><div class="sep"></div>';
    frag.appendChild(d);
  });
  $("#list").appendChild(frag);
  shown += slice.length;

  const e = $("#empty");
  if (!VIEW.length){
    e.style.display = "block";
    e.innerHTML = "검색 결과가 없습니다<br><span style='font-size:12.5px'>품목코드 또는 품목명 일부를 입력해 보세요</span>";
  } else e.style.display = "none";

  $("#totalCnt").textContent = VIEW.length.toLocaleString("ko-KR");
  let sum = 0, amtSum = 0;
  for (const r of VIEW){ sum += (r[2] || 0); amtSum += (r[4] || 0); }
  $("#sumQty").textContent = fmt(sum);
  $("#sumAmt").textContent = fmtInt(amtSum) + "원";
  refreshGroupUI();
  $("#sumSub").textContent = VIEW.length === ALL.length
    ? "품목 " + ALL.length.toLocaleString("ko-KR") + "종"
    : "검색 " + VIEW.length.toLocaleString("ko-KR") + "종 / 전체 " + ALL.length.toLocaleString("ko-KR") + "종";
}

function refreshGroupUI(){
  var st = groupStats();
  $("#groupBtnCnt").textContent = st.length;
  const sub = $("#gSubTxt");
  if (sub){
    let sq = 0, sa = 0;
    for (const x of st){ sq += x.q; sa += x.a; }
    sub.textContent = fmt(st.length) + "개 그룹 · " + fmt(sq) + "개 · " + fmtInt(sa) + "원";
  }
  const tag = $("#gTag");
  if (group){
    const o = st.find(x => x.g === group) || { n: 0, q: 0, a: 0 };
    tag.style.display = "flex";
    tag.innerHTML = '<span class="tg">' + esc(group) +
      '<button id="gTagX" aria-label="해제">✕</button></span>' +
      '<span class="cnt">' + fmt(o.n) + '종 · ' + fmt(o.q) + '개 · ' + fmtInt(o.a) + '원</span>';
  } else {
    tag.style.display = "none";
    tag.innerHTML = "";
  }
}

function apply(){
  var q = ($("#q").value || "").trim().toUpperCase().replace(/\s+/g, "");
  VIEW = ALL.filter(function(r){
    if (group && (r[5] || "미분류") !== group) return false;
    if (!q) return true;
    return String(r[0]).toUpperCase().replace(/\s+/g, "").indexOf(q) >= 0 ||
           String(r[1]).toUpperCase().replace(/\s+/g, "").indexOf(q) >= 0;
  });
  render(true);
}

window.addEventListener("scroll", function(){
  if (shown >= VIEW.length) return;
  if (window.innerHeight + window.scrollY > document.body.offsetHeight - 500) render(false);
}, { passive: true });

$("#searchBtn").onclick = function(){
  var w = $("#searchWrap");
  w.classList.toggle("on");
  if (w.classList.contains("on")) setTimeout(() => $("#q").focus(), 60);
  else { $("#q").value = ""; apply(); }
};
$("#q").addEventListener("input", apply);

(function(){
  var tb = $("#topBtn");
  if (!tb) return;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var on = false;
  var sync = function(){
    const y = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
    var want = y > 300;
    if (want === on) return;
    on = want;
    tb.classList.toggle("on", want);
    tb.setAttribute("aria-hidden", want ? "false" : "true");
  };
  window.addEventListener("scroll", sync, { passive: true });
  window.addEventListener("resize", sync);
  tb.addEventListener("click", function(){
    window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
    shown = false; tb.classList.remove("on");
  });
  sync();
})();

$("#sumCard").onclick = () => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });

$("#groupBtn").addEventListener("click", openGroups);
$("#gClose").addEventListener("click", closeGroups);
$("#gModal").addEventListener("click", e => { if (e.target.id === "gModal") closeGroups(); });
$("#gList").addEventListener("click", e => {
  const b = e.target.closest(".grow");
  if (!b) return;
  group = b.getAttribute("data-g") || "";
  closeGroups(); apply();
  window.scrollTo({ top: 0, behavior: "smooth" });
});
$("#gTag").addEventListener("click", e => { if (e.target.id === "gTagX"){ group = ""; apply(); } });

/* ── 서버에서 재고 읽기 ── */
function toRows(rows){
  return (rows || []).map(function(r){
    return [String(r[0]), String(r[1]), Number(r[2]) || 0,
      (r[3] === null || r[3] === undefined) ? null : Number(r[3]),
      (r[4] === null || r[4] === undefined) ? null : Number(r[4]),
      r[5] ? String(r[5]) : "미분류"];
  });
}
function setLive(ok, text){
  var el = $("#live");
  if (!el) return;
  el.className = "live" + (ok ? "" : " off");
  el.innerHTML = '<i></i>' + text;
}
function stamp(t){
  var el = $("#stampTxt");
  if (el) el.textContent = t ? "데이터 기준 " + t : "데이터 기준 —";
}

function load(first){
  return fetch(API + "?t=" + Date.now(), { cache: "no-store" })
    .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(d){
      if (!d || !Array.isArray(d.rows) || !d.rows.length) throw new Error("빈 데이터");
      var changed = d.updated !== STATE;
      if (changed){
        ALL = toRows(d.rows);
        STATE = d.updated || "";
        apply();
        stamp(STATE);
      }
      setLive(true, "<b>자동 업데이트</b> · " + (STATE || "-") + " 기준");
      if (!first && changed){
        $("#reloadBar").classList.add("on");
        setTimeout(function(){ $("#reloadBar").classList.remove("on"); }, 6000);
      }
      return d;
    })
    .catch(function(err){
      setLive(false, "서버 연결 실패 · " + (err.message || ""));
      if (first){
        var e = $("#empty");
        e.style.display = "block";
        e.innerHTML = "재고를 불러오지 못했습니다<br><span style='font-size:12.5px'>잠시 뒤 새로고침해 주세요</span>";
      }
      throw err;
    });
}

$("#reloadBar").onclick = function(){ location.reload(); };

/* 서비스워커 등록 + 새 버전 감지 */
if ("serviceWorker" in navigator && !window.STATIC_DATA){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("/sw.js").catch(function(){});
  });
  var refreshed = false;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if (refreshed) return;
    refreshed = true;
    var bar = $("#reloadBar");
    if (bar){ bar.classList.add("on"); }
  });
}

/* 부팅 */
load(true).catch(function(){});
setInterval(function(){ load(false).catch(function(){}); }, POLL);
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "visible") load(false).catch(function(){});
});

</script>
